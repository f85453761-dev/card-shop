<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>
    <!-- FontAwesome ikonkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header qismi -->
    <header class="header">
        <div class="logo">Ecommerce</div>
        
        <!-- Savatcha ikonkasi va mahsulotlar soni (badge) -->
        <div id="face-bar">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-quantity-count">0</span>
        </div>
    </header>

    <!-- Asosiy mahsulotlar -->
    <main class="shop-container">
        <h1>Shop products</h1>
        <div class="shop-content">
            <!-- 1-mahsulot -->
            <div class="card">
                <img class="shirt" src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="Shirt">
                <h2 class="aer">AEROREADY SHIRT</h2>
                <span class="price">25$</span>
                <i id="addd" class="fa-solid fa-cart-shopping add-cart"></i>
            </div>

            <!-- 2-mahsulot -->
            <div class="card">
                <img class="shirt" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Earbuds">
                <h2 class="aer">WIRELESS EARBUDS</h2>
                <span class="price">100$</span>
                <i id="addd" class="fa-solid fa-cart-shopping add-cart"></i>
            </div>

            <!-- 3-mahsulot -->
            <div class="card">
                <img class="shirt" src="https://images.unsplash.com/photo-1544441893-675973e31985?w=500" alt="Parka">
                <h2 class="aer">HOODED PARKA</h2>
                <span class="price">45$</span>
                <i id="addd" class="fa-solid fa-cart-shopping add-cart"></i>
            </div>
        </div>
    </main>

    <!-- Savatcha Sidebar -->
    <div id="cart-sidebar" class="cart">
        <h2 class="cart-title">Your Cart</h2>

        <!-- Mahsulotlar tushadigan joy -->
        <div class="cart-content"></div>

        <!-- Jami summa -->
        <div class="total">
            <div class="total-title">Total</div>
            <div id="total-amount">$0</div>
        </div>

        <!-- Buy Now tugmasi -->
        <button type="button" class="buy-btn">Buy Now</button>

        <!-- Yopish tugmasi -->
        <i class="fa-solid fa-xmark" id="close-cart"></i>
    </div>

    <!-- Overlay (Orqa fon qorayishi) -->
    <div id="cart-overlay" class="overlay"></div>

    <script src="script.js"></script>
</body>
</html>
