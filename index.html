<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <div class="container">

        <div class="header">
            <h1 class="eco">Ecommerce</h1>
            <div id="face-bar">
                 <i class="fa-solid fa-bag-shopping"></i>
        
        
                 <span class="cart-quantity-count">0</span>
            </div>
        </div>

        <hr>

        <h1 class="shop">Shop products</h1>

        <div class="cards">
            <div class="card">
                <img class="shirt" src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?q=80&w=715&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h1 class="aer">AEROREADY SHIRT</h1>
                <div class="add">
                    <p class="price">25$</p>
                    <i id="addd" class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>

            <div class="card">
                <img class="shirt" src="https://images.unsplash.com/photo-1606741965326-cb990ae01bb2?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h1 class="aer">WIRELESS EARBUDS</h1>
                <div class="add">
                    <p class="price">100$</p>
                    <i id="addd" class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>

            <div class="card">
                <img class="shirt" src="https://media.istockphoto.com/id/136568907/photo/a-purple-winter-parka-for-a-fashion-image.webp?a=1&b=1&s=612x612&w=0&k=20&c=WLQhxS5pMS14QTTSXJxQjGLeYB8cMtr12OJfLqtstGo=" alt="">
                <h1 class="aer">HOODED PARKA</h1>
                <div class="add">
                    <p class="price">45$</p>
                    <i id="addd" class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>

            <div class="card">
                <img class="shirt" src="https://plus.unsplash.com/premium_photo-1681154819686-43fcc4dc4df3?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h1 class="aer">STRAW METAL BOTTLE</h1>
                <div class="add">
                    <p class="price">24$</p>
                    <i id="addd" class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>

            <div class="card">
                <img class="shirt" src="https://plus.unsplash.com/premium_photo-1672088819323-0dd6b822b027?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h1 class="aer">SILVER METAL</h1>
                <div class="add">
                    <p class="price">50$</p>
                    <i id="addd" class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>

            <div class="card">
                <img class="shirt" src="https://images.unsplash.com/photo-1745284504844-7979176dc29b?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h1 class="aer">BLACK HAT</h1>
                <div class="add">
                    <p class="price">85$</p>
                    <i id="addd" class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>

            <div class="card">
                <img class="shirt" src="https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h1 class="aer">BACKPACK</h1>
                <div class="add">
                    <p class="price">75$</p>
                    <i id="addd" class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>

            <div class="card">
                <img class="shirt" src="https://images.unsplash.com/photo-1612387605285-7ee92eae6958?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
                <h1 class="aer">ULTRABOOST 22</h1>
                <div class="add">
                    <p class="price">40$</p>
                    <i id="addd" class="fa-solid fa-basket-shopping"></i>
                </div>
            </div>
        </div>

    </div>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <i class="fa-solid fa-xmark" id="close-cart"></i>
        </div>
        <hr class="cart-divider">
        
        <div class="cart-content">

            <!-- <div class="card-box">

                <img class="small" src="https://images.unsplash.com/photo-1618354691373-d851c5c3a990?q=80&w=715&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" " alt="">

               <div class="card-box-text">
                
                    <h2 class="title">AEROREADY SHIRT</h2>
                    <h3 class="pric">25$</h3>
                    <input class="quantity" value="1" type="number">

               </div>

               <i id="trash" class="fa-solid fa-trash"></i>

            </div> -->

        </div> 

        <div class="cart-footer">
            <div class="total-price">
                <span>Total</span>
                <span id="total-amount">$0</span>
            </div>
            <button class="buy-btn">Buy Now</button>
        </div>


    </div>

    <div class="cart-overlay" id="cart-overlay"></div>

    <script src="./script.js"></script>
</body>
</html>
